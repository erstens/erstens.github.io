<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>FileDrop</title>
    <!--
      GitHub Pages has no server-side rewrite: any path it cannot resolve to a
      file is served this document (with a 404 status). FileDrop is a single
      page, so the only right answer is to send the visitor to the app root.

      `/` is substituted with the real deploy base at build
      time by the `filedrop-pages-404` plugin in vite.config.ts. The fallback
      below covers the case where this file was copied somewhere by hand and
      never went through that build.

      The fragment is carried across deliberately: `#appId=…&channel=…` is how
      a preconfigured link hands over its settings, and losing it here would
      dump the user on the setup screen for no reason.
    -->
    <script>
      (function () {
        var base = '/';
        if (base.indexOf('__FILEDROP') === 0) {
          // Un-substituted: assume a GitHub Pages project site, where the first
          // path segment is the repository name.
          var segments = location.pathname.split('/').filter(Boolean);
          base =
            /\.github\.io$/i.test(location.hostname) && segments.length > 0
              ? '/' + segments[0] + '/'
              : '/';
        }
        var target = base + location.search + location.hash;
        if (location.pathname !== base) location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0c10;
        color: #a3aec0;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      a {
        color: #3ddcff;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="/">FileDrop</a>…</p>
  </body>
</html>
